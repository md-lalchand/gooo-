name: CI & Release Verification

on:
  push:
    branches: [main, master, 'laravel/**']
  pull_request:
    branches: [main, master, 'security/laravel-production-hardening']

jobs:
  node-and-frontend:
    name: TypeScript Lint, Unit Tests & Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock
      - run: npm run lint
      - run: npm run build
      - name: Run unit and integration tests
        run: npx tsx --test src/lib/*.test.ts src/server/*.test.ts
      - name: Verify installable Laravel ZIP archive hygiene
        run: |
          test -f public/downloads/academy-lms-laravel13.zip
          unzip -t public/downloads/academy-lms-laravel13.zip
          ! unzip -l public/downloads/academy-lms-laravel13.zip | grep -qE '(^|/)(\.env|storage/installed\.lock)'

  laravel-production-suite:
    name: Laravel 13 PHP 8.3 Feature & Security Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: laravel-system
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, openssl, pdo_sqlite, pdo_mysql, pdo_pgsql, zip, gd, xml, ctype, bcmath
      - run: composer install --no-interaction --prefer-dist
      - name: Prepare isolated testing environment
        run: |
          cp .env.example .env
          printf 'APP_KEY=base64:%s\n' "$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"
          touch database/database.sqlite
      - name: Run Laravel Feature & Unit Test Suite
        run: php artisan test --stop-on-failure

  runtime-smoke:
    name: Node API & Laravel Runtime Smoke Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock
      - run: npm run build
      - name: Start Node API in production mode
        env:
          NODE_ENV: production
          SESSION_SECRET: ci-only-session-secret-that-is-at-least-thirty-two-characters-long
          REDIS_URL: redis://127.0.0.1:6379
          PORT: '3100'
        run: |
          set -euo pipefail
          cleanup() {
            kill "${pid_3100:-}" "${pid_3101:-}" 2>/dev/null || true
          }
          trap cleanup EXIT

          wait_for_api() {
            local port="$1"
            local pid="$2"
            local log="$3"
            local output="$4"
            for attempt in $(seq 1 30); do
              if curl --fail --silent "http://127.0.0.1:${port}/api/public/bootstrap" > "$output"; then
                return 0
              fi
              if ! kill -0 "$pid" 2>/dev/null; then
                echo "Node API process on port ${port} exited before becoming healthy."
                cat "$log"
                return 1
              fi
              sleep 2
            done
            echo "Node API process on port ${port} did not become healthy."
            cat "$log"
            return 1
          }

          # Initialize the shared SQLite test database with the first process.
          # Starting both processes simultaneously races the first-run schema/seed setup.
          npm start > /tmp/node-api-3100.log 2>&1 &
          pid_3100=$!
          wait_for_api 3100 "$pid_3100" /tmp/node-api-3100.log /tmp/node-bootstrap.json

          PORT=3101 npm start > /tmp/node-api-3101.log 2>&1 &
          pid_3101=$!
          wait_for_api 3101 "$pid_3101" /tmp/node-api-3101.log /tmp/node-bootstrap-3101.json

          # Both processes must consume the same Redis guest-IP counter.
          last_status=0
          for attempt in $(seq 1 121); do
            port=3100
            if [ $((attempt % 2)) -eq 0 ]; then port=3101; fi
            last_status=$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:${port}/api/public/bootstrap")
          done
          test "$last_status" = "429"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, openssl, pdo_sqlite, pdo_mysql, pdo_pgsql, zip, gd, xml, ctype, bcmath
      - name: Prepare Laravel runtime
        working-directory: laravel-system
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate --force
          mkdir -p database
          touch database/database.sqlite
          php artisan migrate --force
      - name: Start Laravel runtime and verify health
        working-directory: laravel-system
        run: |
          php artisan serve --host=127.0.0.1 --port=8100 > /tmp/laravel-runtime.log 2>&1 &
          echo $! > /tmp/laravel-runtime.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8100/up > /tmp/laravel-health.txt; then
              break
            fi
            sleep 2
          done
          test -s /tmp/laravel-health.txt
          kill "$(cat /tmp/laravel-runtime.pid)" || true
